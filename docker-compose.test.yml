version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cafeteria_db_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: cafeteria_test
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: cafeteria_pgadmin_test
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cafeteria.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5051:80"
    restart: unless-stopped
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafeteria_backend_test
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/cafeteria_test?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafeteria_frontend_test
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cafeteria_tunnel_test
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://frontend:80
    restart: unless-stopped
    depends_on:
      - frontend

  tunnel-notifier:
    image: curlimages/curl:latest
    container_name: cafeteria_tunnel_notifier_test
    entrypoint:
      - /bin/sh
      - -c
      - |
        LAST_URL=""
        while true; do
          URL=$$(curl -s http://tunnel:2000/metrics | grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' | head -n 1)
          if [ -n "$$URL" ] && [ "$$URL" != "$$LAST_URL" ]; then
            echo "Nuevo tunel detectado: $$URL. Enviando correo..."
            curl -sL -H "Content-Type: text/plain; charset=utf-8" \
              -d "Hola Julian, el servidor de Cafeteria (Testing) ya esta activo en Internet. Ingresa desde aqui: $$URL" \
              "https://script.google.com/macros/s/AKfycbxVS4jb4JAlTZimqCKm7Jgb4ofUCFD0uwrsU9zB9YfwL72sdLLoDDmtd05_-CR5xjs3dA/exec"
            echo ""
            LAST_URL="$$URL"
          fi
          sleep 10
        done
    restart: unless-stopped
    depends_on:
      - tunnel

volumes:
  postgres_test_data:
