<div class="page-container">
  <div class="header-actions">
    <h2>Configuración de Tolvas</h2>
    <button class="btn btn-primary" (click)="openForm(1)">Configurar Tolva 1</button>
  </div>

  <app-generic-table [data]="activeConfigs()" [columns]="columns">
    <ng-template let-config>
      <button class="btn btn-sm btn-secondary" (click)="openForm(config.slotNumber)">Cambiar Café</button>
      <button class="btn btn-sm btn-outline" (click)="viewHistory(config.slotNumber)">Ver Historial</button>
    </ng-template>
  </app-generic-table>

  <!-- FORMULARIO -->
  @if (showForm()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-modal title="Configurar Tolva">
        <div class="form-group">
          <label>Número de Tolva *</label>
          <input type="number" formControlName="slotNumber" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label>Café en Grano *</label>
          <select formControlName="productId" class="form-control">
            <option [ngValue]="null">Seleccionar café...</option>
            @for (bean of coffeeBeans(); track bean.id) {
              <option [ngValue]="bean.id">{{ bean.name }}</option>
            }
          </select>
          @if (form.controls.productId.invalid && form.controls.productId.touched) {
            <span class="error-text">El café es requerido.</span>
          }
        </div>

        <ng-container modal-actions>
          <button type="button" class="btn btn-secondary" (click)="closeForm()" [disabled]="isSaving()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
            @if (isSaving()) { <i class="pi pi-spinner pi-spin"></i> }
            Guardar
          </button>
        </ng-container>
      </app-modal>
    </form>
  }

  <!-- HISTORIAL -->
  @if (showHistory()) {
    <app-modal title="Historial de Tolva" (close)="closeHistory()">
      @if (isLoadingHistory()) {
        <div style="text-align:center; padding: 2rem;">
          <i class="pi pi-spinner pi-spin" style="font-size: 2rem;"></i>
        </div>
      } @else {
        <app-generic-table [data]="historyConfigs()" [columns]="historyColumns"></app-generic-table>
      }
      <ng-container modal-actions>
        <button type="button" class="btn btn-secondary" (click)="closeHistory()">Cerrar</button>
      </ng-container>
    </app-modal>
  }
</div>
