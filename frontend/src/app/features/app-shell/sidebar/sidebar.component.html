<div class="sidebar-overlay" *ngIf="isOpen" (click)="close.emit()"></div>

<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <button class="desktop-toggle" (click)="toggle.emit()" aria-label="Alternar menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12H21"/>
        <path d="M3 6H21"/>
        <path d="M3 18H21"/>
      </svg>
    </button>
    <h3 class="brand-text">Menú</h3>
    <button class="close-btn mobile-close" (click)="close.emit()" aria-label="Cerrar menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  
  <nav class="sidebar-nav">
    <ul *ngIf="authService.session() as session">
      <!-- Icon Template to stay DRY -->
      <ng-template #menuIcon let-label="label">
        <svg *ngIf="label === 'Inicio'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg *ngIf="label === 'Gestión de Usuarios'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 11C11.2091 11 13 9.20914 13 7C13 4.79086 11.2091 3 9 3C6.79086 3 5 4.79086 5 7C5 9.20914 6.79086 11 9 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 3.13C16.8604 3.35031 17.623 3.85071 18.1676 4.55232C18.7122 5.25392 19.0078 6.11683 19.0078 7.005C19.0078 7.89318 18.7122 8.75608 18.1676 9.45769C17.623 10.1593 16.8604 10.6597 16 10.88" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg *ngIf="label === 'Menús' || label === 'Productos'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 6H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 14H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg *ngIf="label === 'Pedidos'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2L3 6V20C3 20.5304 3.21071 21.0391 3.58579 21.4142C3.96086 21.7893 4.46957 22 5 22H19C19.5304 22 20.0391 21.7893 20.4142 21.4142C20.7893 21.0391 21 20.5304 21 20V6L18 2H6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 10C16 11.0609 15.5786 12.0783 14.8284 12.8284C14.0783 13.5786 13.0609 14 12 14C10.9391 14 9.92172 13.5786 9.17157 12.8284C8.42143 12.0783 8 11.0609 8 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg *ngIf="label === 'Configuraciones' || label === 'Configuración'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.4 15A1.65 1.65 0 0 0 21 16.65V18.26A2 2 0 0 1 19.34 20.24A10.82 10.82 0 0 1 15 21.54A2 2 0 0 1 13 19.64V18a1.65 1.65 0 0 0-1.65-1.65H12.65A1.65 1.65 0 0 0 11 18v1.64a2 2 0 0 1-2 1.9A10.82 10.82 0 0 1 4.66 20.24A2 2 0 0 1 3 18.26v-1.61A1.65 1.65 0 0 0 4.65 15H5a1.65 1.65 0 0 0 1.65-1.65v-.7A1.65 1.65 0 0 0 5 11h-.35A1.65 1.65 0 0 0 3 12.65v1.61a2 2 0 0 1-1.66 1.98A10.82 10.82 0 0 1 1.34 12 2 2 0 0 1 3 10.02v-1.6A1.65 1.65 0 0 0 4.65 7H5a1.65 1.65 0 0 0 1.65-1.65v-.7A1.65 1.65 0 0 0 5 3h-.35A1.65 1.65 0 0 0 3 4.65v1.61A2 2 0 0 1 1.34 8.24 10.82 10.82 0 0 1 5 6.94 2 2 0 0 1 7 8.84v1.64A1.65 1.65 0 0 0 8.65 12h.7A1.65 1.65 0 0 0 11 10.35v-1.6A2 2 0 0 1 13 6.85a10.82 10.82 0 0 1 4.34-1.3 2 2 0 0 1 1.66 1.98v1.61A1.65 1.65 0 0 0 19.35 11H19a1.65 1.65 0 0 0-1.65 1.65v.7A1.65 1.65 0 0 0 19 15h.4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </ng-template>

      <li *ngFor="let menu of session.menus">
        
        <!-- Parent Menu (Has Children) -->
        <ng-container *ngIf="menu.children && menu.children.length > 0">
          <a class="menu-parent" (click)="toggleSubmenu(menu.id, $event)" [class.active]="expandedMenus[menu.id]" style="cursor: pointer;">
            <span class="menu-icon">
              <ng-container *ngTemplateOutlet="menuIcon; context: { label: menu.label }"></ng-container>
            </span>
            <span class="menu-text">{{ menu.label }}</span>
            <span class="chevron-icon" [class.rotated]="expandedMenus[menu.id]">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9L12 15L18 9"></path>
              </svg>
            </span>
          </a>
          
          <ul class="submenu" [class.expanded]="expandedMenus[menu.id]">
            <li *ngFor="let child of menu.children">
              <a [routerLink]="child.url" routerLinkActive="active" (click)="close.emit()">
                <span class="menu-text">{{ child.label }}</span>
              </a>
            </li>
          </ul>
        </ng-container>

        <!-- Leaf Menu (No Children) -->
        <ng-container *ngIf="!menu.children || menu.children.length === 0">
          <a *ngIf="menu.url" [routerLink]="menu.url" routerLinkActive="active" (click)="close.emit()">
            <span class="menu-icon">
              <ng-container *ngTemplateOutlet="menuIcon; context: { label: menu.label }"></ng-container>
            </span>
            <span class="menu-text">{{ menu.label }}</span>
          </a>
          <!-- Fallback if no URL and no children -->
          <span *ngIf="!menu.url" class="menu-title">{{ menu.label }}</span>
        </ng-container>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17L21 12L16 7" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 12H9" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logout-text">Cerrar Sesión</span>
    </button>
  </div>
</aside>
