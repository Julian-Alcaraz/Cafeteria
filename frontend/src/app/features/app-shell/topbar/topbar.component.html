<header class="topbar">
  <div class="topbar-left">
    <button class="menu-toggle" (click)="toggleMenu.emit()" aria-label="Abrir menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h2 class="brand-title">Cafetería Admin</h2>
  </div>

  <div class="user-info" *ngIf="authService.session() as session">
      <app-theme-toggle></app-theme-toggle>
    <div class="user-details">
      <span class="greeting">Bienvenido,</span>
      <span class="username">{{ session.username }}</span>
    </div>
    <div class="avatar">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="var(--text-title)"/>
        <path d="M20 20C22.2091 20 24 18.2091 24 16C24 13.7909 22.2091 12 20 12C17.7909 12 16 13.7909 16 16C16 18.2091 17.7909 20 20 20Z" fill="var(--bg-surface)"/>
        <path d="M28 29.5C28 25.9101 24.4183 23 20 23C15.5817 23 12 25.9101 12 29.5C12 29.7761 12.2239 30 12.5 30H27.5C27.7761 30 28 29.7761 28 29.5Z" fill="var(--bg-surface)"/>
      </svg>
    </div>
  </div>
</header>
