<div class="page-container">
  <div class="header-actions">
    <h2>Proveedores</h2>
    <button class="btn btn-primary" (click)="openForm()">Nuevo Proveedor</button>
  </div>

  <app-generic-table [data]="suppliers()" [columns]="columns"></app-generic-table>

  @if (showForm()) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-modal title="Nuevo Proveedor" (close)="closeForm()">
        <div class="form-group">
          <label>Nombre / Razón Social *</label>
          <input type="text" formControlName="name" class="form-control">
          @if (form.controls.name.invalid && form.controls.name.touched) {
            <span class="error-text">El nombre es requerido.</span>
          }
        </div>
        <div class="form-group">
          <label>CUIT / RUT</label>
          <input type="text" formControlName="taxId" class="form-control">
        </div>
        <div class="form-group">
          <label>Persona de Contacto</label>
          <input type="text" formControlName="contactName" class="form-control">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="form-control">
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <span class="error-text">Email inválido.</span>
          }
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" formControlName="phone" class="form-control">
        </div>

        <ng-container modal-actions>
          <button type="button" class="btn btn-secondary" (click)="closeForm()" [disabled]="isSaving()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
            @if (isSaving()) { <i class="pi pi-spinner pi-spin"></i> }
            Guardar
          </button>
        </ng-container>
      </app-modal>
    </form>
  }
</div>
